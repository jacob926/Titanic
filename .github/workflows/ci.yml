name: MLOps CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Cloner le code source
      uses: actions/checkout@v4

    - name: 2. Configurer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 4. Tester la syntaxe et les dépendances
      run: |
        python -c "import fastapi, joblib, sklearn, pandas; print('Toutes les bibliothèques se chargent correctement !')"

    - name: 5. Tester la construction de l'image Docker
      run: |
        docker build -t titanic-api:test .